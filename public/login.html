<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · ai-bridge</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234f46e5'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23ffffff' font-family='Arial' font-weight='700' font-size='16'%3EAB%3C/text%3E%3C/svg%3E"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --primary-soft: #e0e7ff;
        --accent: #7c3aed;
        --accent-soft: #ede9fe;
        --success: #059669;
        --success-soft: #d1fae5;
        --danger: #dc2626;
        --danger-soft: #fee2e2;
        --bg: #f7f8fc;
        --bg-2: #f1f5f9;
        --text: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --border: #e2e8f0;
        --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.06);
        --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.08);
        --radius: 8px;
      }
      body {
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: var(--text);
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.08) 0%, transparent 25%),
          radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.08) 0%, transparent 25%);
        pointer-events: none;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        background: #fff;
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        padding: 40px 36px;
        position: relative;
        border: 1px solid var(--border);
      }
      .login-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .login-logo {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        color: #fff;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 18px;
        box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.35);
      }
      .login-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 4px;
        letter-spacing: -0.01em;
      }
      .login-subtitle {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 6px;
        letter-spacing: 0.04em;
      }
      .form-input {
        width: 100%;
        height: 42px;
        padding: 0 14px;
        font-size: 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        font-family: inherit;
      }
      .form-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
        background: #fff;
      }
      .btn-primary {
        width: 100%;
        height: 42px;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.02em;
        transition: background 0.15s;
        font-family: inherit;
      }
      .btn-primary:hover {
        background: var(--primary-dark);
      }
      .btn-primary:disabled {
        background: var(--text-muted);
        cursor: not-allowed;
      }
      .alert {
        padding: 10px 14px;
        border-radius: var(--radius);
        font-size: 13px;
        margin-bottom: 18px;
        display: none;
      }
      .alert.error {
        background: var(--danger-soft);
        color: var(--danger);
        border: 1px solid rgba(220, 38, 38, 0.2);
        display: block;
      }
      .alert.success {
        background: var(--success-soft);
        color: var(--success);
        border: 1px solid rgba(5, 150, 105, 0.2);
        display: block;
      }
      .login-footer {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.6;
      }
      .login-footer code {
        background: var(--bg-2);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">AB</div>
        <div class="login-title">ai-bridge</div>
        <div class="login-subtitle" id="login-subtitle">AI 智能体桥接器 · <span id="login-version">v--</span></div>
      </div>

      <div class="alert" id="alert"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
            autofocus
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="btn-primary" type="submit" id="btn-login">登 录</button>
      </form>

      <div class="login-footer">
        默认管理员：<code>admin</code><br />
        首次启动密码写入 <code>~/.config/agent-canvas/secrets.env</code><br />
        本地访问（127.0.0.1 / ::1）免登录
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        // v5.5.1: 动态获取版本号（不依赖硬编码）
        (async () => {
          try {
            const r = await fetch('/api/system/version');
            if (r.ok) {
              const d = await r.json();
              if (d && d.data && d.data.version) {
                const el = document.getElementById('login-version');
                if (el) el.textContent = 'v' + d.data.version;
              }
            }
          } catch {}
        })();

        // 已有登录 cookie 则直接进首页
        fetch('/api/auth/me', { credentials: 'same-origin' })
          .then((r) => (r.ok ? location.replace('/') : Promise.reject()))
          .catch(() => {
            localStorage.removeItem('aibridge_user');
          });

        const form = document.getElementById('login-form');
        const btn = document.getElementById('btn-login');
        const alertEl = document.getElementById('alert');

        function showAlert(msg, type) {
          alertEl.className = 'alert ' + type;
          alertEl.textContent = msg;
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const username = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;
          if (!username || !password) {
            showAlert('请输入用户名和密码', 'error');
            return;
          }
          btn.disabled = true;
          btn.textContent = '登录中...';
          try {
            const r = await fetch('/api/auth/login', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            });
            const data = await r.json();
            if (!r.ok || !data.success) {
              showAlert(data.error || '登录失败', 'error');
              btn.disabled = false;
              btn.textContent = '登 录';
              return;
            }
            // 保存用户信息（token 已写入 httpOnly cookie）
            localStorage.setItem('aibridge_user', JSON.stringify(data.data.user));
            showAlert('登录成功，正在跳转...', 'success');
            setTimeout(() => location.replace('/'), 300);
          } catch (err) {
            showAlert('网络错误: ' + err.message, 'error');
            btn.disabled = false;
            btn.textContent = '登 录';
          }
        });
      })();
    </script>
  </body>
</html>
